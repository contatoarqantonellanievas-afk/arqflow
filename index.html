<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
:root{
  --off:#F5F3EE;--ink:#171717;--sand:#D8CBB8;--olive:#68705C;
  --terr:#B29A84;--white:#fff;--muted:#85837C;--line:#ECE9E2;
  --shadow:0 10px 30px rgba(32,33,31,.055);--radius:18px
}
*{box-sizing:border-box} body{margin:0;background:var(--off);color:var(--ink);font-family:Montserrat,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:#F0EEE8;color:#30312D;padding:28px 18px;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{padding:4px 12px 30px;border-bottom:1px solid #DDD9D0}
.brand b{font-size:24px;letter-spacing:.18em;font-weight:700;color:#30312D}.brand span{display:block;color:#89877F;font-size:11px;letter-spacing:.12em;margin-top:8px;text-transform:uppercase}
.nav{padding-top:22px}.nav button{width:100%;border:0;background:transparent;color:#73736D;text-align:left;padding:13px 12px;border-radius:12px;margin:3px 0;font-size:14px}.nav button:hover,.nav button.active{background:#E4E0D8;color:#30312D}.nav button.active{box-shadow:inset 3px 0 0 #A7AD9B}
.main{margin-left:260px;width:calc(100% - 260px);padding:34px 42px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-size:11px;font-weight:700}.topbar h1{font-family:Georgia,serif;font-weight:500;font-size:32px;margin:5px 0 0}
.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:700}.btn-dark{background:var(--ink);color:#fff}.btn-light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-olive{background:var(--olive);color:#fff}.btn-ter{background:var(--terr);color:#fff}.btn-danger{background:#f5e7e3;color:#8b3f2c}
.hero{background:#EEEAE2;color:#30312D;border-radius:24px;padding:34px;display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin-bottom:22px}.hero h2{font:500 36px/1.08 Montserrat,sans-serif;margin:8px 0 12px;max-width:650px}.hero p{color:#6F6E68;max-width:650px;line-height:1.6;margin:0}.hero .btn{background:#D8D0C2;color:#30312D}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.3fr .7fr}.cards{grid-template-columns:repeat(3,1fr)}
.card{background:#FEFEFC;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font:600 29px Montserrat,sans-serif;margin:12px 0 5px}.kpi .sub{font-size:12px;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.section-title h3{font:500 22px Montserrat,sans-serif;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stage{background:#FBFAF7;border:1px solid var(--line);padding:17px;border-radius:14px}.stage b{display:block;font-size:23px;margin-bottom:7px}.stage small{color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td strong{font-weight:700}.status{display:inline-flex;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.05em}.s-enviado{background:#eeeae2}.s-negociacao{background:#f1e7d5}.s-aprovado{background:#e3e9df}.s-perdido{background:#f1dfda}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4d4a45}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(104,112,92,.1)}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.result{background:#F0EEE8;color:#30312D;border-radius:16px;padding:22px}.result .big{font:600 38px Georgia,serif;margin:7px 0;color:#30312D}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.55}.checklist{display:grid;gap:9px}.check{display:flex;align-items:center;gap:10px;padding:11px;background:#FBFAF7;border-radius:10px}.check input{accent-color:var(--olive)}
.service-head{display:flex;justify-content:space-between;align-items:flex-start}.service-head h3{font:500 22px Montserrat,sans-serif;margin:0}.tag{background:#eeece6;border-radius:20px;padding:5px 9px;font-size:10px}.etapas{margin-top:17px}.etapa{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-box{background:var(--off);border-radius:20px;max-width:620px;width:100%;padding:26px;max-height:90vh;overflow:auto}.modal-box h3{font:500 25px Montserrat,sans-serif;margin-top:0}
.proposal{background:#fff;border-radius:20px;padding:40px;box-shadow:var(--shadow);max-width:900px;margin:auto}.proposal .brandline{letter-spacing:.22em;font-weight:800;font-size:13px}.proposal h2{font:500 38px Montserrat,sans-serif;margin:50px 0 12px}.proposal .amount{font:600 34px Montserrat,sans-serif}.proposal hr{border:0;border-top:1px solid var(--line);margin:25px 0}.proposal-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.print-only{display:none}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:12px;display:none;z-index:100;box-shadow:var(--shadow)}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:25px}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:18px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.brand{padding-bottom:18px}.hero{display:block}.hero h2{font-size:29px}.kpis,.form,.proposal-grid{grid-template-columns:1fr}.funnel{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h1{font-size:27px}}



#proposalPaper hr{margin:10px 0}
#proposalPaper h2{margin:8px 0 3px}
#proposalPaper p{margin:6px 0}
#proposalPaper .proposal-grid{gap:18px}
#proposalPaper .paper-payment-table{margin-top:7px}
#proposalPaper .paper-payment-row{padding:8px 12px}


/* ===== PDF / IMPRESSÃO — FOLHA A4 ===== */
@media print{
  @page{ size:A4 portrait; margin:0; }
  html,body{
    margin:0!important;padding:0!important;width:210mm!important;min-height:297mm!important;
    background:#fff!important;overflow:visible!important;
  }
  body > .app, body > .app > .main, #main{
    display:block!important;width:210mm!important;min-height:297mm!important;height:auto!important;
    margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important;
  }
  body > .app > .sidebar,.topbar,.no-print,.modal,.toast{display:none!important;}
  #main > *{display:none!important;}
  #main > .proposal,#proposalPaper{
    display:block!important;position:relative!important;box-sizing:border-box!important;
    width:210mm!important;min-width:210mm!important;max-width:210mm!important;
    margin:0!important;padding:0!important;background:#fff!important;border:0!important;
    border-radius:0!important;box-shadow:none!important;overflow:visible!important;
  }
  #proposalPaper .proposal-print-page{
    box-sizing:border-box!important;
    width:210mm!important;height:297mm!important;min-height:297mm!important;
    padding:15mm 17mm!important;margin:0!important;background:#fff!important;
    overflow:hidden!important;position:relative!important;
    page-break-after:always!important;break-after:page!important;
  }
  #proposalPaper .proposal-print-page:last-child{
    page-break-after:auto!important;break-after:auto!important;
  }
  #proposalPaper .proposal-logo-wrap{
    position:absolute!important;
    top:15mm!important;
    right:17mm!important;
    width:68mm!important;
    height:26mm!important;
    margin:0!important;
    display:flex!important;
    align-items:flex-start!important;
    justify-content:flex-end!important;
    z-index:2!important;
  }
  #proposalPaper .proposal-logo-wrap img{
    max-width:58mm!important;
    max-height:22mm!important;
    width:auto!important;
    height:auto!important;
  }
  #proposalPaper .brandline{margin-top:0!important;}
  #proposalPaper hr{margin:7mm 0!important;}
  #proposalPaper h2{margin:5mm 0 1mm!important;}
  #proposalPaper p{margin:4mm 0!important;}
  #proposalPaper .proposal-grid{gap:18px!important;}
  #proposalPaper .paper-payment-row{padding:7px 10px!important;break-inside:avoid!important;page-break-inside:avoid!important;}
  #proposalPaper .proposal-print-page > *{
    break-inside:avoid!important;page-break-inside:avoid!important;
  }
  #proposalPaper .proposal-print-page-1 .paper-includes-section{position:relative!important;top:-6mm!important;}
  #proposalPaper .paper-payment-option{
    break-inside:avoid!important;page-break-inside:avoid!important;
  }
}

<style id="nav-icons-refinement">
.nav-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  display:inline-block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.65;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.78;
  transition:transform .18s ease, opacity .18s ease;
}
nav a:hover .nav-icon,
nav button:hover .nav-icon,
.sidebar a:hover .nav-icon,
.sidebar button:hover .nav-icon,
.nav-item:hover .nav-icon,
.nav-link:hover .nav-icon{
  opacity:1;
  transform:translateY(-.5px);
}
.active .nav-icon,
nav a.active .nav-icon,
nav button.active .nav-icon,
.sidebar a.active .nav-icon,
.sidebar button.active .nav-icon{
  opacity:1;
}

<script>
const KEY='arqflow_release_v4';
// Versão de entrega: inicia sempre limpa para um novo profissional.
try{localStorage.removeItem(KEY);}catch(e){}
const baseInteriorService={
 id:'base-interiores',
 name:'Projeto de Interiores',
 steps:[
  {name:'Briefing e levantamento de necessidades',hours:6},
  {name:'Levantamento / conferência de medidas',hours:8},
  {name:'Estudo de layout e setorização',hours:12},
  {name:'Conceito e referências visuais',hours:8},
  {name:'Estudo preliminar',hours:16},
  {name:'Modelagem 3D',hours:24},
  {name:'Imagens / perspectivas para apresentação',hours:12},
  {name:'Revisões e ajustes',hours:10},
  {name:'Projeto executivo',hours:24},
  {name:'Detalhamentos e especificações',hours:16},
  {name:'Memorial / especificação de materiais',hours:8},
  {name:'Apresentação e entrega final',hours:6}
 ]
};
baseInteriorService.hours=baseInteriorService.steps.reduce((a,b)=>a+b.hours,0);

const defaultProposalScope=[
 {name:'Conceito e layout',description:'Briefing, estudo de layout e direção estética.'},
 {name:'Projeto e apresentação',description:'Modelagem 3D e apresentação dos ambientes.'},
 {name:'Detalhamento e entrega',description:'Desenhos técnicos e especificação de materiais.'}
];
const defaultState={
 pricing:{prolabore:0,fixed:0,variable:0,hours:0,productive:0,tax:0,margin:0},
 services:[],
 budgets:[],
 proposals:[],
 payments:[],
 paymentPlans:{},
 logo:'',
 proposalScopeTemplate:structuredClone(defaultProposalScope),
 proposalIdentity:{architect:'',office:'',cau:'',address:''},
 proposalTechnicalSupport:{enabled:false,value:0,description:''}
};
let state=load();
state.pricing={...defaultState.pricing,...(state.pricing||{})};
state.services=Array.isArray(state.services)?state.services:[];
state.budgets=Array.isArray(state.budgets)?state.budgets:[];
state.proposals=Array.isArray(state.proposals)?state.proposals:[];
state.payments=Array.isArray(state.payments)?state.payments:[];
state.paymentPlans=state.paymentPlans&&typeof state.paymentPlans==='object'?state.paymentPlans:{};
state.paymentOptions=state.paymentOptions&&typeof state.paymentOptions==='object'?state.paymentOptions:{};
state.proposalScopeTemplate=Array.isArray(state.proposalScopeTemplate)&&state.proposalScopeTemplate.length
 ? state.proposalScopeTemplate.map((x,i)=>({name:String(x?.name||`Etapa ${i+1}`),description:String(x?.description||'')}))
 : structuredClone(defaultProposalScope);
if(!state.proposalScopeTemplate.some(x=>x.name.trim()&&x.description.trim())) state.proposalScopeTemplate=structuredClone(defaultProposalScope);
state.proposalIdentity={...defaultState.proposalIdentity,...(state.proposalIdentity||{})};
state.proposalTechnicalSupport={...defaultState.proposalTechnicalSupport,...(state.proposalTechnicalSupport||{})};
if(!state.proposalTechnicalSupport.description) state.proposalTechnicalSupport.description=defaultTechnicalSupportDescription();
state.proposalScopeTemplate=state.proposalScopeTemplate.length?state.proposalScopeTemplate:structuredClone(defaultProposalScope);
normalizeState();
function load(){
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
  const loaded={...defaultState,...saved};
  loaded.services=Array.isArray(saved.services)?saved.services:[...defaultState.services];
  if(!loaded.services.some(s=>s.id==='base-interiores')) loaded.services=[baseInteriorService,...loaded.services];
  return loaded;
 }catch(e){return structuredClone(defaultState)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function parseNumber(value){
 const n=Number(value);
 if(typeof value==='number') return Number.isFinite(value)?value:0;
 if(value===null||value===undefined||String(value).trim()==='') return 0;
 let s=String(value).trim().replace(/\s/g,'');
 if(s.includes('.') && s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
 else if(s.includes(',')) s=s.replace(',','.');
 else if(/^[-+]?\d{1,3}(?:\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
 const parsed=Number(s);
 return Number.isFinite(parsed)?parsed:0;
}
function round2(v){const n=parseNumber(v);return Math.round(n*100)/100}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(parseNumber(v))}
function dateBR(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function calcPricing(p=state.pricing){
 const n=k=>Math.max(0,parseNumber(p?.[k]));
 const prolabore=n('prolabore');
 const fixed=n('fixed');
 const variable=n('variable');
 const hours=n('hours');
 const productive=Math.min(100,n('productive'));
 const tax=Math.min(99.99,n('tax'));
 const margin=n('margin');
 const base=prolabore+fixed+variable;
 const productiveHours=hours*(productive/100);
 const before=productiveHours>0?base/productiveHours:0;
 const taxRate=tax/100;
 const marginRate=Math.min(99.99,margin)/100;
 const afterTax=tax<100?before/(1-taxRate):0;
 const denominator=1-taxRate-marginRate;
 const final=denominator>0?before/denominator:0;
 const floor=afterTax;
 const ceiling=final>0?final*1.25:0;
 return {base:round2(base),productiveHours:round2(productiveHours),before:round2(before),afterTax:round2(afterTax),final:round2(final),floor:round2(floor),ceiling:round2(ceiling)};
}

function getInstallmentPaid(bid,index){
 return round2(state.payments
   .filter(p=>p.budgetId===bid && Number(p.installmentIndex)===Number(index) && p.status==='RECEBIDO')
   .reduce((a,p)=>a+(Number(p.amount)||0),0));
}
function getInstallmentInfo(bid,index,item){
 const total=round2(item?.amount||0), paid=getInstallmentPaid(bid,index);
 const balance=round2(Math.max(0,total-paid));
 const due=item?.due||'';
 let status=balance<=0.009?'RECEBIDO':'EM ABERTO';
 if(status!=='RECEBIDO' && due){
   const today=localDateISO();
   if(due<today) status='VENCIDO';
 }
 return {total,paid,balance,due,status};
}
function getReceivableTotals(){
 let open=0, overdue=0, received=0;
 state.budgets.forEach(b=>{
   const plan=getPlan(b.id);
   plan.forEach((item,i)=>{
     const info=getInstallmentInfo(b.id,i,item);
     received+=info.paid;
     if(info.status==='VENCIDO') overdue+=info.balance;
     else if(info.status==='EM ABERTO') open+=info.balance;
   });
 });
 return {open,overdue,received,receivable:round2(open+overdue)};
}
function getPaymentRows(){
 const rows=[];
 state.budgets.forEach(b=>{
   getPlan(b.id).forEach((item,i)=>{
     if(!item || !(Number(item.amount)||0)) return;
     const info=getInstallmentInfo(b.id,i,item);
     rows.push({budget:b,installmentIndex:i,item,info});
   });
 });
 return rows;
}
function getBudgetRange(b){
 const saved=b?.range;
 if(saved && typeof saved==='object' && [saved.min,saved.estimated,saved.max].every(v=>v!==undefined)) return {min:round2(saved.min),estimated:round2(saved.estimated),max:round2(saved.max)};
 const pricing=calcPricing();
 const hours=round2(b?.hours||0);
 return {min:round2(hours*pricing.floor),estimated:round2(b?.value||hours*pricing.final),max:round2(hours*pricing.ceiling)};
}

function normalizeState(){
  state.pricing={...defaultState.pricing,...(state.pricing||{})};
  ['prolabore','fixed','variable','hours','productive','tax','margin'].forEach(k=>state.pricing[k]=parseNumber(state.pricing[k]));
  state.services=(Array.isArray(state.services)?state.services:[]).map(s=>({
    ...s,
    id:String(s.id||id()), name:String(s.name||'Serviço sem nome'),
    steps:(Array.isArray(s.steps)?s.steps:[]).map(e=>({name:String(e.name||''),hours:round2(e.hours)})).filter(e=>e.name)
  }));
  if(!state.services.some(s=>s.id==='base-interiores')) state.services.unshift(baseInteriorService);
  state.services.forEach(s=>s.hours=round2(s.steps.reduce((a,e)=>a+parseNumber(e.hours),0)));
  state.budgets=(Array.isArray(state.budgets)?state.budgets:[]).map(b=>({...b,id:String(b.id||id()),value:round2(b.value),hours:round2(b.hours),client:String(b.client||''),project:String(b.project||''),service:String(b.service||''),status:String(b.status||'ENVIADO'),steps:Array.isArray(b.steps)?b.steps:[]}));
  state.proposals=Array.isArray(state.proposals)?state.proposals:[];
  state.payments=(Array.isArray(state.payments)?state.payments:[]).map(p=>({...p,amount:round2(p.amount)}));
  state.paymentPlans=state.paymentPlans&&typeof state.paymentPlans==='object'?state.paymentPlans:{};
  state.proposalScopeTemplate=Array.isArray(state.proposalScopeTemplate)?state.proposalScopeTemplate.map(x=>({
    name:String(x.name||''),description:String(x.description||''),deadline:String(x.deadline||''),conditions:String(x.conditions||'')
  })).filter(x=>x.name||x.description||x.deadline||x.conditions):[];
}

function localDateISO(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function addScopeStage(){

 if(!editor)return;

 if(empty)empty.remove();
 const addButton=document.getElementById('addScopeStage');
 const row=document.createElement('div');
 row.innerHTML=scopeRowHTML({},editor.querySelectorAll('.scope-edit-row').length);
 const node=row.firstElementChild;
 if(node)editor.insertBefore(node,addButton);
 renumberScopeStages();

 input?.focus();

function renumberScopeStages(){
 document.querySelectorAll('#scopeEditor .scope-edit-row').forEach((row,i)=>{
   const label=row.querySelector('strong');
   if(label)label.textContent=`Etapa ${i+1}`;
 });
}
function bindScopeEditorEvents(){
 const editor=document.getElementById('scopeEditor');
 if(!editor)return;
 if(editor.dataset.bound==='1')return;
 editor.dataset.bound='1';
 editor.addEventListener('input',()=>syncScopeTemplateAndPreview());
 editor.addEventListener('change',()=>syncScopeTemplateAndPreview());
 editor.addEventListener('click',e=>{
   const add=e.target.closest('#addScopeStage');
   if(add){addScopeStage();return;}
   const remove=e.target.closest('.removeScope');
   if(remove){
     remove.closest('.scope-edit-row')?.remove();
     renumberScopeStages();
     if(!editor.querySelector('.scope-edit-row')){
       const empty=document.createElement('div');
       empty.id='scopeEmptyState';
       empty.className='empty';
       empty.style.cssText='margin:0;padding:18px';
       empty.innerHTML='Nenhuma etapa adicionada ainda.<br><span style="font-size:11px">Clique em “Adicionar etapa do seu escopo” para montar a estrutura da proposta.</span>';
       editor.insertBefore(empty,document.getElementById('addScopeStage'));
     }
     syncScopeTemplateAndPreview();
   }
 });
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openModal(title,body){

}
function bind(){
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));

 const pricingFields=['prolabore','fixed','variable','hours','productive','tax','margin'];
 const readPricingFields=()=>{
   const next={...state.pricing};
   pricingFields.forEach(k=>{const el=document.getElementById(k);next[k]=el?parseNumber(el.value):parseNumber(next[k]);});
   return next;
 };
 const renderPricingResult=(result)=>{
   const out=document.getElementById('pricingResult');
   const meta=document.getElementById('pricingMeta');
   if(!out)return;
   out.innerHTML=money(result.final)+'<span style="font-size:15px;font-weight:600"> / hora</span>';
   if(meta){
     meta.textContent=result.final>0?`${result.productiveHours.toFixed(1)}h faturáveis/mês · base ${money(result.before)}/h · após impostos ${money(result.afterTax)}/h`:'Preencha horas disponíveis e percentual produtivo para calcular o valor/hora.';
     meta.style.color=result.final>0?'#6F6E68':'#8D5D49';
   }
 };
 const refreshPricing=({persist=true}={})=>{
   const temp=readPricingFields(),result=calcPricing(temp);
   renderPricingResult(result);
   if(persist){state.pricing={...state.pricing,...temp,hourly:result.final};save();}
   return {temp,result};
 };
 pricingFields.forEach(k=>{
   const el=document.getElementById(k);if(!el)return;
   el.addEventListener('focus',()=>{if(el.value==='0')el.value='';});
   el.addEventListener('input',()=>refreshPricing());
   el.addEventListener('change',()=>refreshPricing());
   el.addEventListener('blur',()=>{if(el.value.trim()==='')el.value='';else{el.value=String(parseNumber(el.value));refreshPricing();}});

 if(sp)sp.onclick=()=>{const {result}=refreshPricing();if(result.final<=0)return toast('Preencha horas disponíveis e percentual produtivo para salvar uma precificação válida.');toast('Precificação salva.');render('pricing');};

function serviceModal(serviceId){
 const s=state.services.find(x=>x.id===serviceId)||{name:'',steps:[]};
 openModal(serviceId?'Editar serviço':'Novo serviço',`<div class="form">${field('mName','Nome do serviço','text',s.name,true)}</div><div style="margin-top:18px;font-weight:700">Etapas</div><div id="mSteps">${s.steps.map((e,i)=>stepRow(i,e)).join('')}</div><button class="btn btn-light" id="addStep" style="margin-top:10px">＋ Adicionar etapa</button><div class="actions"><button class="btn btn-dark" id="saveService">Salvar serviço</button></div>`);
 document.getElementById('addStep').onclick=()=>{const box=document.getElementById('mSteps');const index=box.querySelectorAll('.stepRow').length;box.insertAdjacentHTML('beforeend',stepRow(index,{}));box.lastElementChild?.querySelector('.sn')?.focus()};
 document.getElementById('saveService').onclick=()=>{
  const steps=[...document.querySelectorAll('#mSteps .stepRow')].map(r=>({name:r.querySelector('.sn').value.trim(),hours:round2(parseNumber(r.querySelector('.sh').value))})).filter(x=>x.name);
  if(!document.getElementById('mName').value.trim())return toast('Informe o nome do serviço.');
  if(!steps.length)return toast('Adicione pelo menos uma etapa com horas válidas.');
   if(steps.some(x=>x.hours<=0))return toast('Todas as etapas precisam ter horas maiores que zero.');
   const totalHours=round2(steps.reduce((a,b)=>a+parseNumber(b.hours),0));
  if(serviceId){
    s.name=document.getElementById('mName').value.trim();
    s.steps=steps;
    s.hours=totalHours;
  }else{
    state.services.push({id:id(),name:document.getElementById('mName').value.trim(),steps,hours:totalHours});
  }
  normalizeState();
  save();
  document.getElementById('modal').classList.remove('open');
  render('services');
  toast('Serviço salvo.');
 };
}
function stepRow(i,e={}){
 const name=String(e.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
 const hours=parseNumber(e.hours);
 return `<div class="stepRow" style="display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;margin-top:8px">
   <input class="sn" type="text" value="${name}" placeholder="Nome da etapa">
   <input class="sh" type="number" min="0.01" step="0.01" inputmode="decimal" value="${hours>0?hours:''}" placeholder="Horas">
 </div>`;
}
function loadSteps(){const s=state.services.find(x=>x.id===document.getElementById('serviceSelect').value);const box=document.getElementById('stepsBox');if(!s){box.innerHTML='<div class="empty">Selecione um serviço para carregar as etapas.</div>';updateBudgetPreview();return}box.innerHTML=`<div style="font-size:12px;color:#777;margin-bottom:9px">Selecione as etapas que farão parte do orçamento:</div><div class="checklist">${s.steps.map((e,i)=>`<label class="check"><input type="checkbox" class="stepCheck" data-index="${i}" data-hours="${e.hours}" checked> <span>${esc(e.name)}</span><strong style="margin-left:auto">${e.hours}h</strong></label>`).join('')}</div>`;document.querySelectorAll('.stepCheck').forEach(x=>x.onchange=updateBudgetPreview);updateBudgetPreview()}
function updateBudgetPreview(){
 const serviceId=document.getElementById('serviceSelect')?.value;
 const s=state.services.find(x=>x.id===serviceId);
 const valueEl=document.getElementById('budgetValue'),minEl=document.getElementById('budgetMin'),estEl=document.getElementById('budgetEstimated'),maxEl=document.getElementById('budgetMax'),metaEl=document.getElementById('budgetMeta');
 if(!s){
   [valueEl,minEl,estEl,maxEl].forEach(el=>{if(el)el.textContent=money(0)});
   if(metaEl)metaEl.textContent='Selecione um serviço e as etapas.';
   return;
 }
 const complexity=parseNumber(document.getElementById('complexity')?.value)||1;
 const h=round2([...document.querySelectorAll('.stepCheck:checked')].reduce((a,x)=>a+parseNumber(x.dataset.hours),0)*complexity);
 const c=calcPricing();
 const v=round2(h*c.final), min=round2(h*c.floor), max=round2(h*c.ceiling);
 if(valueEl)valueEl.textContent=money(v);
 if(minEl)minEl.textContent=money(min);
 if(estEl)estEl.textContent=money(v);
 if(maxEl)maxEl.textContent=money(max);
 if(metaEl){
   metaEl.textContent=c.final>0
     ? `${h.toFixed(1)} horas estimadas · complexidade aplicada · ${money(c.final)}/h`
     : 'Configure sua precificação para gerar o valor do orçamento.';
 }
}
function saveBudget(){
 const client=document.getElementById('clientName')?.value.trim()||'';
 const project=document.getElementById('project')?.value.trim()||'';
 const sid=document.getElementById('serviceSelect')?.value||'';
 const s=state.services.find(x=>x.id===sid);
 if(!client||!project||!s)return toast('Informe o cliente, o nome do projeto e escolha o serviço.');
 const selected=[...document.querySelectorAll('.stepCheck:checked')].map(x=>s.steps[Number(x.dataset.index)]).filter(Boolean);
 if(!selected.length)return toast('Selecione pelo menos uma etapa.');
 const pricing=calcPricing();
 if(pricing.final<=0)return toast('Configure a precificação antes de salvar o orçamento.');
 const complexity=parseNumber(document.getElementById('complexity')?.value)||1;
 const hours=round2(selected.reduce((a,x)=>a+(Number(x.hours)||0),0)*complexity);
 const value=round2(hours*pricing.final);
 const budgetMin=round2(hours*pricing.floor);
 const budgetMax=round2(hours*pricing.ceiling);
 if(value<=0)return toast('O orçamento calculado precisa ser maior que zero.');
 const b={id:id(),date:localDateISO(),client,project,service:s.name,hours,value,status:'ENVIADO',steps:selected.map(x=>x.name),range:{min:budgetMin,estimated:value,max:budgetMax}};
 state.budgets.push(b);
 save();
 toast('Orçamento salvo. Abrindo Proposta Comercial...');
 setTimeout(()=>render('proposal'),250);
}

function getPlan(bid){
 const saved=state.paymentPlans?.[bid];
 if(Array.isArray(saved) && saved.length) return saved.map((x,i)=>({description:String(x.description||`Parcela ${i+1}`),amount:round2(x.amount),due:x.due||''}));
 const prop=state.proposals.find(x=>x.budgetId===bid);
 if(Array.isArray(prop?.paymentPlan) && prop.paymentPlan.length) return prop.paymentPlan.map((x,i)=>({description:String(x.description||`Parcela ${i+1}`),amount:round2(x.amount),due:x.due||''}));
 const b=state.budgets.find(x=>x.id===bid), savedProp=state.proposals.find(x=>x.budgetId===bid), total=round2(savedProp?.totalValue ?? b?.value ?? 0), first=round2(total*.5);
 return [{description:'Na contratação',amount:first,due:''},{description:'Na entrega do projeto',amount:round2(total-first),due:''}];
}
function defaultPaymentOptions(bid){
 const b=state.budgets.find(x=>x.id===bid), savedProp=state.proposals.find(x=>x.budgetId===bid), total=round2(savedProp?.totalValue ?? b?.value ?? 0), half=round2(total/2);
 return [
   {title:'À vista',fixed:true,plan:[{description:'Pagamento à vista',amount:total,due:''}]},
   {title:'50% Contratação + 50% Entrega Final',fixed:true,plan:[
      {description:'50% na contratação',amount:half,due:''},
      {description:'50% na entrega final',amount:round2(total-half),due:''}
   ]}
 ];
}
function getPaymentOptions(bid){
 const saved=state.paymentOptions?.[bid];
 if(Array.isArray(saved) && saved.length){
   const normalized=saved.map((o,i)=>({title:String(o?.title||`Opção ${i+1}`),fixed:!!o?.fixed,plan:Array.isArray(o?.plan)&&o.plan.length?o.plan.map((x,j)=>({description:String(x.description||`Parcela ${j+1}`),amount:round2(x.amount),due:x.due||''})):[{description:'Pagamento',amount:0,due:''}]}));
   // Compatibilidade com a versão anterior: se só existir a opção À vista padrão, recria também a opção 50/50.
   if(normalized.length===1 && normalized[0].title.trim().toLowerCase()==='à vista') return defaultPaymentOptions(bid);
   return normalized;
 }
 const prop=state.proposals.find(x=>x.budgetId===bid);
 if(Array.isArray(prop?.paymentOptions) && prop.paymentOptions.length) return prop.paymentOptions.map((o,i)=>({title:String(o?.title||`Opção ${i+1}`),fixed:!!o?.fixed,plan:Array.isArray(o?.plan)&&o.plan.length?o.plan.map((x,j)=>({description:String(x.description||`Parcela ${j+1}`),amount:round2(x.amount),due:x.due||''})):[{description:'Pagamento',amount:0,due:''}]}));
 return defaultPaymentOptions(bid);
}

function saveProposal(print=false){
 const budgetId=document.getElementById('proposalBudget')?.value;
 const b=state.budgets.find(x=>x.id===budgetId);if(!b)return;
 const totalValue=round2(document.getElementById('propValue')?.value||b.value);
 const paymentOptions=readPaymentOptions();
 const invalidOption=paymentOptions.findIndex(o=>Math.abs(round2((o.plan||[]).reduce((a,x)=>a+x.amount,0))-totalValue)>.01);
 if(totalValue<=0)return toast('Informe um valor total válido para a proposta.');
 if(invalidOption>=0)return toast(`A ${paymentOptions[invalidOption].title||`opção ${invalidOption+1}`} precisa somar exatamente o valor da proposta.`);
 const plan=Array.isArray(state.paymentPlans?.[b.id])&&state.paymentPlans[b.id].length?state.paymentPlans[b.id]:(paymentOptions[0]?.plan||[]);

 const prop={
   budgetId:b.id,
   date:document.getElementById('propDate').value,
   validity:+document.getElementById('propValidity').value||10,
   totalValue,
   title:document.getElementById('propTitle').value,
   name:document.getElementById('propName').value,
   email:document.getElementById('propEmail').value,
   phone:document.getElementById('propPhone').value,
   intro:document.getElementById('propIntro').value,
   scopeItems:readScopeEditor(),
   technicalSupport:{
     enabled:!!document.getElementById('propTechnicalEnabled')?.checked,
     value:round2(document.getElementById('propTechnicalValue')?.value||0),
     description:document.getElementById('propTechnicalDescription')?.value.trim()||defaultTechnicalSupportDescription()
   },
   inclusos:document.getElementById('propInclusos').value,
   naoInclusos:document.getElementById('propNaoInclusos').value,
   bankDetails:document.getElementById('propBank').value,
   paymentOptions,
   paymentPlan:plan,
   payment:paymentOptions.map(o=>`${o.title}: ${(o.plan||[]).map(x=>`${x.description}: ${money(x.amount)}${x.due?' · '+dateBR(x.due):''}`).join(' | ')}`).join(' || '),
   notes:document.getElementById('propNotes').value,
   proposalIdentity:{...state.proposalIdentity}
 };

 state.proposalScopeTemplate=readScopeEditor();
 state.paymentOptions[b.id]=paymentOptions;
 state.proposalTechnicalSupport={
   enabled:!!document.getElementById('propTechnicalEnabled')?.checked,
   value:round2(document.getElementById('propTechnicalValue')?.value||0),
   description:document.getElementById('propTechnicalDescription')?.value.trim()||defaultTechnicalSupportDescription()
 };
 state.paymentPlans=state.paymentPlans||{};
 state.paymentPlans[b.id]=plan;

 // Keep the saved proposal and its payment plan synchronized.
 prop.paymentPlan=plan.map(x=>({description:x.description,amount:x.amount,due:x.due}));

 const old=state.proposals.findIndex(x=>x.budgetId===b.id);
 if(old>=0)state.proposals[old]=prop;else state.proposals.push(prop);
 save();

 if(print){
   toast('Proposta atualizada.');
   setTimeout(()=>window.print(),100);
 }else{
   toast('Proposta salva. Confira a pré-visualização antes de gerar o PDF.');
   proposalSelectedBudgetId=budgetId;
   updateProposalPreview();
   openProposalPreview();
 }
}

function paymentModal(bid){
 const b=state.budgets.find(x=>x.id===bid),plan=getPlan(bid);
 if(!b)return;
 const available=plan.map((x,i)=>({ ...x,index:i,info:getInstallmentInfo(bid,i,x)})).filter(x=>x.info.balance>.009);
 if(!available.length)return toast('Não há parcelas em aberto para este orçamento.');
 openModal('Registrar recebimento',`<div class="payment-context"><div><span>Cliente</span><strong>${esc(b.client)}</strong></div><div><span>Valor total</span><strong>${money(b.value)}</strong></div></div><div class="form"><div class="field full"><label>Parcela</label><select id="payInstallment">${available.map(x=>`<option value="${x.index}" data-balance="${x.info.balance}">${x.index+1}. ${esc(x.description)} — ${money(x.info.balance)} restante</option>`).join('')}</select></div>${field('payAmount','Valor recebido','number',available[0]?.info.balance||0)}${field('payDue','Data do recebimento','date',localDateISO())}</div><div class="note payment-note">O recebimento é vinculado à parcela escolhida. O saldo da parcela diminui automaticamente.</div><div class="actions"><button class="btn btn-dark" id="savePayment">Registrar recebimento</button></div>`);
 const sel=document.getElementById('payInstallment');
 if(sel)sel.onchange=()=>{const amount=document.getElementById('payAmount');if(amount)amount.value=(Number(sel.selectedOptions[0].dataset.balance)||0).toFixed(2)};
 const saveBtn=document.getElementById('savePayment');
 if(saveBtn)saveBtn.onclick=()=>{
   const idx=Number(sel?.value);
   const amount=round2(document.getElementById('payAmount')?.value||0);
   const item=plan[idx];
   if(!item||amount<=0)return toast('Informe um valor válido.');
   const remaining=getInstallmentInfo(bid,idx,item).balance;
   if(amount>remaining+.01)return toast(`O valor máximo desta parcela é ${money(remaining)}.`);
   state.payments.push({id:id(),budgetId:bid,client:b.client,installmentIndex:idx,installment:item.description,amount,due:document.getElementById('payDue')?.value||'',status:'RECEBIDO',received:localDateISO()});
   save();document.getElementById('modal').classList.remove('open');render('control');toast('Recebimento registrado.');
 };
}
