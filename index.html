<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARQFLOW — Precificação para Arquitetos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f8f8f6;--panel:#fff;--ink:#222;--muted:#777;--line:#e9e7e2;
  --accent:#DDEFE3;--accentText:#36513E;--butter:#F4E29A;--pink:#FCE8F0;
  --danger:#b54a4a;--shadow:0 4px 18px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:250px;background:#fff;
  border-right:1px solid var(--line);padding:28px 17px;z-index:10
}
.brand{font-size:30px;font-weight:800;letter-spacing:2px;padding:3px 12px}
.brand span{font-weight:400}
.tag{font-size:10px;color:#999;padding:3px 12px 25px;line-height:1.4}
.nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:11px;text-align:left;
  border:0;background:transparent;color:var(--ink);padding:10px 11px;border-radius:10px;
  font-size:13px
}
.nav-btn:hover{background:var(--pink)}
.nav-btn.active{outline:2px solid var(--pink);background:#fff}
.nav-icon{
  width:34px;height:34px;min-width:34px;border-radius:9px;background:var(--butter);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#333
}
.main{margin-left:250px;padding:34px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.top h1{margin:0;color:#b5a45c;font-size:28px;font-weight:600;text-transform:uppercase}
.top p{margin:7px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}
.field-help{font-size:10.5px;color:#555;line-height:1.45;margin-top:7px}
.field-example{font-size:10.5px;color:#666;line-height:1.45;margin-top:6px;padding:8px 9px;background:#faf8ef;border-left:3px solid var(--butter);border-radius:5px}
.field-tip{font-size:10.5px;color:#4e6b58;line-height:1.45;margin-top:6px;padding:8px 9px;background:#eef7f0;border-radius:5px}

.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;
  background:#fff;color:var(--ink);outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#d5c57d}
.btn{
  border:0;border-radius:9px;padding:11px 16px;background:var(--accent);
  color:var(--accentText);font-weight:700
}
.btn.secondary{background:#eeeae5;color:var(--ink)}
.btn.danger{background:#f8e2e2;color:var(--danger)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.section{margin-top:22px}
.section h2{font-size:17px;margin:0 0 12px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.metric{font-size:28px;font-weight:800;margin-top:8px}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.result{background:var(--butter);border-radius:14px;padding:22px}
.result small{color:#665f3f}
.result .big{font-size:34px;font-weight:800;margin-top:6px}
.stage-list{display:grid;gap:8px}
.stage-row{display:grid;grid-template-columns:1fr 100px 42px;gap:8px}
.stage-row input{padding:10px;border:1px solid var(--line);border-radius:7px}
.stage-select{
  display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff
}
.stage-select input{accent-color:#d8c98b}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
.table th{font-size:10px;color:var(--muted);text-transform:uppercase}
.status{padding:7px;border:1px solid var(--line);border-radius:7px;background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;font-size:11px}
.tab.active{background:var(--butter);border-color:var(--butter)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.toast{
 position:fixed;right:24px;bottom:24px;background:#292929;color:#fff;padding:12px 16px;
 border-radius:9px;display:none;z-index:50
}

/* Proposta */
.proposal-layout{display:grid;grid-template-columns:430px 1fr;gap:20px;align-items:start}
.proposal-editor{position:sticky;top:20px}
.proposal-preview{background:#e9e9e6;border-radius:14px;padding:20px;min-height:900px}
.paper{
 background:#fff;color:#222;max-width:820px;min-height:1060px;margin:auto;padding:55px 60px;
 box-shadow:0 5px 25px rgba(0,0,0,.12);font-family:Montserrat,Arial,sans-serif
}
.paper-brand{font-size:25px;font-weight:800;letter-spacing:2px}
.paper-brand span{font-weight:400}
.paper-kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#777;margin-top:6px}
.paper-line{height:3px;width:70px;background:#d8c98b;margin:18px 0 27px}
.paper h2{font-size:25px;margin:0 0 25px;font-weight:600}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:28px}
.meta-box{border:1px solid #eee;background:#fafafa;border-radius:7px;padding:11px}
.meta-label{font-size:8px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.meta-value{font-size:11px;font-weight:600}
.paper-intro{font-size:11px;line-height:1.7}
.paper-section{margin-top:25px}
.paper-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.scope{border:1px solid #e8e8e8;border-radius:8px;padding:13px}
.scope-name{font-size:13px;font-weight:700;margin-bottom:7px}
.scope-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f1f1;font-size:9px;color:#666}
.total{display:flex;justify-content:space-between;align-items:center;background:#f7f4e8;border-radius:9px;padding:17px;margin-top:22px}
.total-label{font-size:9px;color:#665f3f;text-transform:uppercase;letter-spacing:1px}
.total-value{font-size:24px;font-weight:800}
.paper-copy{font-size:10px;line-height:1.65;white-space:pre-line}
.paper-footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #eee;margin-top:38px;padding-top:12px;color:#888;font-size:8px}

.custom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.color{display:flex;gap:10px;align-items:center}
.color input{width:45px;height:38px;padding:2px}

@media(max-width:1050px){.proposal-layout{grid-template-columns:1fr}.proposal-editor{position:static}.grid,.three{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
 .sidebar{position:static;width:100%;border-right:0;border-bottom:1px solid var(--line)}
 .main{margin-left:0;padding:20px}.nav{flex-direction:row;overflow:auto}.nav-btn{min-width:max-content}
 .grid,.two,.three,.formgrid,.custom-grid{grid-template-columns:1fr}
 .paper{padding:35px 25px}
}
@media print{
 body{background:#fff}
 body>*{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{position:absolute;left:0;top:0;width:100%}
 .paper{box-shadow:none;max-width:none;margin:0;min-height:auto}
 @page{size:A4;margin:0}
}

/* ===== PERSONALIZAÇÃO / LOGO ===== */
body.dark-mode{
  --bg:#151515;
  --ink:#f4f4f0;
  background:#151515;
  color:#f4f4f0;
}
body.dark-mode .card,
body.dark-mode .panel,
body.dark-mode .table,
body.dark-mode .paper-wrap{
  background:#202020;
  color:#f4f4f0;
  border-color:#333;
}
body.dark-mode .field input,
body.dark-mode .field select,
body.dark-mode .field textarea{
  background:#171717;
  color:#f4f4f0;
  border-color:#3b3b3b;
}
body.dark-mode .note,
body.dark-mode .muted,
body.dark-mode .label{
  color:#bdbdbd;
}
.logo-upload{
  border:1.5px dashed #cfcfc8;
  border-radius:16px;
  padding:18px;
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
}
.logo-preview{
  width:180px;
  height:90px;
  border:1px solid #ddd;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  overflow:hidden;
}
.logo-preview img{
  max-width:92%;
  max-height:82%;
  object-fit:contain;
}
.logo-preview.empty{
  color:#999;
  font-size:12px;
  background:#fafafa;
}
.logo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media print{
  .paper-brand img.proposal-logo{
    max-height:58px !important;
    max-width:220px !important;
    display:block !important;
    object-fit:contain !important;
  }
}


/* =========================================================
   ARQFLOW — DESIGN SYSTEM | SOFISTICAÇÃO & MINIMALISMO
   ========================================================= */
:root{
  --bg:#FBFBFD;
  --surface:#FFFFFF;
  --surface-soft:#F6F6F7;
  --ink:#1D1D1F;
  --muted:#86868B;
  --accent:#C5A880;
  --accent-dark:#A88D67;
  --olive:#354235;
  --line:#E8E8EA;
  --line-strong:#D9D9DC;
  --shadow:0 8px 30px rgba(29,29,31,.055);
  --shadow-soft:0 3px 14px rgba(29,29,31,.045);
  --radius:8px;
}

/* Base */
html,body{
  background:var(--bg) !important;
  color:var(--ink) !important;
}
body{
  font-family:'Montserrat',Arial,sans-serif !important;
  font-weight:400;
  letter-spacing:-.01em;
}
h1,h2,h3,h4,h5,h6{
  font-family:'Montserrat',Arial,sans-serif !important;
  font-weight:400 !important;
  color:var(--ink) !important;
  letter-spacing:-.025em;
}
h1{font-weight:300 !important}
h2,h3{font-weight:400 !important}

/* App shell */
.sidebar{
  background:#FFFFFF !important;
  border-right:1px solid var(--line) !important;
  box-shadow:none !important;
}
.main{
  background:var(--bg) !important;
}
.brand{
  color:var(--ink) !important;
}
.brand span{
  color:var(--accent-dark) !important;
}
.nav-btn{
  border-radius:8px !important;
  color:var(--muted) !important;
  font-weight:400 !important;
  transition:all .18s ease;
}
.nav-btn:hover{
  background:#F5F5F6 !important;
  color:var(--ink) !important;
}
.nav-btn.active{
  background:#F1ECE5 !important;
  color:var(--ink) !important;
  box-shadow:none !important;
}
.nav-btn.active::before{
  background:var(--accent) !important;
}

/* Header */
.page-head{
  margin-bottom:30px !important;
}
.page-head h1{
  font-size:30px !important;
  font-weight:300 !important;
}
.page-head p{
  color:var(--muted) !important;
  font-size:13px !important;
  line-height:1.7 !important;
}

/* Cards / panels */
.card,.panel,.table,.paper-wrap{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:8px !important;
  box-shadow:var(--shadow-soft) !important;
}
.card{
  padding:26px !important;
}
.card h2{
  font-size:18px !important;
  margin-bottom:20px !important;
}

/* Metrics */
.metric{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:8px !important;
  box-shadow:var(--shadow-soft) !important;
}
.metric .value{
  color:var(--ink) !important;
  font-weight:400 !important;
}
.metric .label{
  color:var(--muted) !important;
}

/* Forms */
.field label{
  color:var(--muted) !important;
  font-size:11px !important;
  font-weight:500 !important;
  letter-spacing:.02em;
}
.field input,
.field select,
.field textarea{
  background:#FFFFFF !important;
  color:var(--ink) !important;
  border:1px solid var(--line-strong) !important;
  border-radius:8px !important;
  box-shadow:none !important;
  font-family:'Montserrat',Arial,sans-serif !important;
  font-weight:400 !important;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  outline:none !important;
  border-color:var(--accent) !important;
  box-shadow:0 0 0 3px rgba(197,168,128,.13) !important;
}

/* Buttons */
.btn{
  background:var(--olive) !important;
  color:#FFFFFF !important;
  border:1px solid var(--olive) !important;
  border-radius:8px !important;
  box-shadow:none !important;
  font-family:'Montserrat',Arial,sans-serif !important;
  font-weight:500 !important;
  letter-spacing:.005em;
  transition:all .18s ease;
}
.btn:hover{
  filter:none !important;
  background:#2B352B !important;
  transform:translateY(-1px);
}
.btn.secondary{
  background:#FFFFFF !important;
  color:var(--ink) !important;
  border:1px solid var(--line-strong) !important;
}
.btn.secondary:hover{
  background:#F7F7F7 !important;
  border-color:#C8C8CB !important;
}
.btn.gold,
.btn.accent{
  background:var(--accent) !important;
  border-color:var(--accent) !important;
  color:#FFFFFF !important;
}

/* Badges / statuses */
.badge{
  border-radius:999px !important;
  font-weight:500 !important;
}
.badge.aprovado{
  background:#E8EEE8 !important;
  color:var(--olive) !important;
}
.badge.enviado,
.badge.negociacao{
  background:#F1ECE5 !important;
  color:#806A4D !important;
}
.badge.negado{
  background:#F1F1F2 !important;
  color:#5F5F63 !important;
}

/* Tables */
table{
  border-collapse:separate !important;
  border-spacing:0 !important;
}
th{
  color:var(--muted) !important;
  font-weight:500 !important;
  font-size:10px !important;
  letter-spacing:.05em;
  text-transform:uppercase;
}
td{
  color:var(--ink) !important;
  border-color:var(--line) !important;
}

/* Helpers */
.note,.muted{
  color:var(--muted) !important;
}
.field-help{
  color:var(--muted) !important;
  line-height:1.65 !important;
}
.field-example{
  background:#F8F5F0 !important;
  border-left:2px solid var(--accent) !important;
  color:#66605A !important;
}
.field-tip{
  background:#F1F4F0 !important;
  border-left:2px solid var(--olive) !important;
  color:#4F584F !important;
}

/* Logo area */
.logo-upload{
  border:1px dashed var(--line-strong) !important;
  border-radius:8px !important;
  background:#FCFCFC !important;
}
.logo-preview{
  border:1px solid var(--line) !important;
  border-radius:8px !important;
  background:#FFFFFF !important;
}

/* Proposal preview */
.paper-wrap{
  background:#ECECED !important;
  box-shadow:none !important;
}
.paper{
  background:#FFFFFF !important;
  box-shadow:0 16px 45px rgba(29,29,31,.10) !important;
}
.paper-brand img.proposal-logo{
  max-height:58px !important;
  max-width:220px !important;
}
.paper-brand{
  color:var(--ink) !important;
}
.paper-brand span{
  color:var(--accent-dark) !important;
}

/* Progress / dividers */
hr{
  border:0 !important;
  border-top:1px solid var(--line) !important;
}
.progress{
  background:#ECECEE !important;
}
.progress > div{
  background:var(--accent) !important;
}

/* Color controls */
.color{
  border:1px solid var(--line-strong) !important;
  border-radius:8px !important;
  background:#FFFFFF !important;
}

/* Dark mode disabled visually in favor of the defined brand system.
   The selected palette remains consistent even if old localStorage says dark. */
body.dark-mode{
  --bg:#FBFBFD !important;
  --surface:#FFFFFF !important;
  --surface-soft:#F6F6F7 !important;
  --ink:#1D1D1F !important;
  --muted:#86868B !important;
  background:#FBFBFD !important;
  color:#1D1D1F !important;
}
body.dark-mode .card,
body.dark-mode .panel,
body.dark-mode .table,
body.dark-mode .paper-wrap{
  background:#FFFFFF !important;
  color:#1D1D1F !important;
  border-color:#E8E8EA !important;
}
body.dark-mode .field input,
body.dark-mode .field select,
body.dark-mode .field textarea{
  background:#FFFFFF !important;
  color:#1D1D1F !important;
  border-color:#D9D9DC !important;
}
body.dark-mode .nav-btn{
  color:#86868B !important;
}
body.dark-mode .nav-btn.active{
  background:#F1ECE5 !important;
  color:#1D1D1F !important;
}


/* =========================================================
   ARQFLOW — BLACK ARCHITECTURAL EDITION
   ========================================================= */
:root{
  --bg:#000000 !important;
  --surface:#090909 !important;
  --surface-soft:#111111 !important;
  --ink:#F4F1EC !important;
  --muted:#9A958D !important;
  --accent:#C5A880 !important;
  --accent-dark:#C5A880 !important;
  --olive:#C5A880 !important;
  --line:#252525 !important;
  --line-strong:#343434 !important;
  --shadow:0 10px 35px rgba(0,0,0,.35) !important;
  --shadow-soft:0 6px 22px rgba(0,0,0,.25) !important;
  --radius:8px !important;
}

html,body{
  background:#000 !important;
  color:#F4F1EC !important;
}
body{
  font-family:'Montserrat',Arial,sans-serif !important;
}
h1,h2,h3,h4,h5,h6{
  color:#F4F1EC !important;
}
.page-head p,.note,.muted,.label,.field label{
  color:#9A958D !important;
}

.sidebar{
  background:#050505 !important;
  border-right:1px solid #222 !important;
  color:#F4F1EC !important;
}
.main{
  background:#000 !important;
}
.brand{
  color:#F4F1EC !important;
}
.brand span{
  color:#C5A880 !important;
}

/* Navigation: beige icons + contextual image-like icon treatment */
.nav-btn{
  background:transparent !important;
  color:#9A958D !important;
  border-radius:8px !important;
  position:relative;
}
.nav-btn:hover{
  background:#111 !important;
  color:#F4F1EC !important;
}
.nav-btn.active{
  background:#15120F !important;
  color:#F4F1EC !important;
  box-shadow:inset 3px 0 0 #C5A880 !important;
}
.nav-btn.active::before{
  background:#C5A880 !important;
}

/* Make existing icon glyphs beige. */
.nav-btn svg,
.nav-btn i,
.nav-btn .icon,
.nav-btn .nav-icon,
.nav-btn span:first-child{
  color:#C5A880 !important;
  fill:#C5A880 !important;
  stroke:#C5A880 !important;
}

/* If navigation uses emoji/text symbols, apply beige tone. */
.nav-btn{
  --icon-color:#C5A880;
}
.nav-btn::after{
  color:#C5A880 !important;
}

/* Cards */
.card,.panel,.table{
  background:#090909 !important;
  color:#F4F1EC !important;
  border:1px solid #252525 !important;
  box-shadow:0 6px 22px rgba(0,0,0,.28) !important;
}
.metric{
  background:#090909 !important;
  border:1px solid #252525 !important;
}
.metric .value{
  color:#F4F1EC !important;
}
.metric .label{
  color:#9A958D !important;
}

/* Forms */
.field input,
.field select,
.field textarea{
  background:#0D0D0D !important;
  color:#F4F1EC !important;
  border:1px solid #333 !important;
}
.field input::placeholder,
.field textarea::placeholder{
  color:#69655F !important;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#C5A880 !important;
  box-shadow:0 0 0 3px rgba(197,168,128,.14) !important;
}

/* Buttons */
.btn{
  background:#C5A880 !important;
  color:#090909 !important;
  border-color:#C5A880 !important;
  border-radius:8px !important;
  font-weight:600 !important;
}
.btn:hover{
  background:#D2B991 !important;
  border-color:#D2B991 !important;
}
.btn.secondary{
  background:#111 !important;
  color:#C5A880 !important;
  border-color:#3A342C !important;
}
.btn.secondary:hover{
  background:#181818 !important;
}

/* Table */
th{
  color:#9A958D !important;
}
td{
  color:#F4F1EC !important;
  border-color:#252525 !important;
}

/* Helpers */
.field-example{
  background:#15120F !important;
  border-left-color:#C5A880 !important;
  color:#B8AEA1 !important;

/* =========================================================

   ========================================================= */
.control-summary{

.tab{display:inline-flex !important;align-items:center;gap:6px}
.tab-count{
  display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:#F0F0F0;color:#777 !important;font-size:8px;font-weight:600;

.status-aprovado{background:#F1F7F0 !important;border-color:#C9D9C7 !important;color:#354235 !important}
.status-em-negociação{background:#FBF6EC !important;border-color:#E2D3BE !important;color:#745E40 !important}
.status-enviado{background:#F5F5F5 !important;color:#555 !important}

.status-pendente{background:#FBF6EC !important;color:#745E40 !important}
.status-recebido,.status-pago{background:#F1F7F0 !important;border-color:#C9D9C7 !important;color:#354235 !important}

.overdue-alert{

/* =========================================================
   ARQFLOW — TEMA CLARO/ESCURO + CORES SEM FUNDO PRETO
   ========================================================= */

/* Color picker: the surrounding control must never be black. */
.color{
  background:#FFFFFF !important;
  border:1px solid #D2D2D7 !important;
  border-radius:8px !important;
  min-height:42px !important;
  padding:2px !important;
}
.color input[type="color"]{
  width:45px !important;
  height:36px !important;
  padding:0 !important;
  margin:0 !important;
  border:0 !important;
  border-radius:6px !important;
  background:transparent !important;
  box-shadow:none !important;
}

/* Top-right theme switch */
.arq-theme-toggle{
  position:fixed;
  top:24px;
  right:28px;
  z-index:100;
  display:flex;
  align-items:center;
  gap:2px;
  padding:4px;
  border:1px solid #E2E0DC;
  border-radius:999px;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  backdrop-filter:blur(8px);
}
.arq-theme-toggle button{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#8A877F;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  font-size:17px;
  line-height:1;
}
.arq-theme-toggle button:hover{
  background:#F5F1EB;
  color:#1D1D1F;
}
.arq-theme-toggle button.active{
  background:#C5A880;
  color:#FFFFFF;
}
.arq-theme-toggle svg{
  width:17px;
  height:17px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

}


/* ===== AJUSTE FINAL DO MODO NOTURNO ===== */
body.dark-mode,
body.dark-mode *{
  color:#FFFFFF !important;
}

/* Elementos secundários também permanecem brancos */
body.dark-mode input::placeholder,
body.dark-mode textarea::placeholder{
  color:#D9D9D9 !important;
}

/* Não deixar fundos/brilhos brancos aparecendo no modo escuro */
body.dark-mode .card,
body.dark-mode .panel,
body.dark-mode .paper-wrap,
body.dark-mode .logo-upload,
body.dark-mode .logo-preview,
body.dark-mode .color,
body.dark-mode .preview-box{
  background:#202020 !important;
}

/* Os campos de cor não devem criar os quadrados brancos extras.
   O próprio input mostra somente a cor escolhida. */
body.dark-mode .color{
  background:#202020 !important;
  border-color:#3E3E3E !important;
}
body.dark-mode .color input[type="color"]{
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
}

/* Remove fundos brancos de áreas de logo/preview no escuro */
body.dark-mode .logo-upload *,
body.dark-mode .logo-preview *{
  background-color:transparent;
}

/* Botões continuam usando o dourado do ARQFLOW, sem bloco branco */
body.dark-mode .btn:not(.secondary){
  color:#FFFFFF !important;
}
body.dark-mode .btn.secondary{
  background:#252525 !important;
  color:#FFFFFF !important;
  border-color:#4A4A4A !important;
}

/* Seleção ativa da sidebar */
body.dark-mode #nav .nav-btn.active{
  background:#2B2722 !important;
  color:#FFFFFF !important;
  border-color:transparent !important;
}

/* Controle Sol/Lua */
body.dark-mode .arq-theme-toggle{
  background:#202020 !important;
}
body.dark-mode .arq-theme-toggle button{
  color:#FFFFFF !important;
}
body.dark-mode .arq-theme-toggle button.active{
  background:#C5A880 !important;
  color:#FFFFFF !important;
}

/* Evita qualquer pseudo-elemento herdado criando caixas claras */
body.dark-mode *::before,
body.dark-mode *::after{
  background-color:transparent;
  color:inherit;
}


/* =========================================================
   AJUSTE FINO — ÁREAS COM CONTEÚDO x ÁREAS VAZIAS
   ========================================================= */

/* No modo noturno, o fundo geral vazio é preto/grafite. */
body.dark-mode{
  background:#151515 !important;
}
body.dark-mode .main{
  background:#151515 !important;
}

/* Cards que CONTÊM conteúdo continuam com superfície escura,
   e o texto branco permanece legível. */
body.dark-mode .card,
body.dark-mode .panel{
  background:#202020 !important;
  color:#FFFFFF !important;
}

/* Quando existir uma área explicitamente branca com conteúdo
   (ex.: bloco de proposta/preview), preserva o branco e usa
   texto preto para manter contraste. */
body.dark-mode .paper,
body.dark-mode .proposal-paper,
body.dark-mode .white-paper,
body.dark-mode .preview-white{

  color:#1D1D1F !important;
}

body.dark-mode .proposal-paper *,
body.dark-mode .white-paper *,
body.dark-mode .preview-white *{

}

/* Áreas VAZIAS não recebem quadrado branco. */
body.dark-mode .empty,
body.dark-mode .launch-empty{
  background:transparent !important;
}

/* ===== PERSONALIZAÇÃO ===== */
/* Os campos de cor são caixas de conteúdo: não criar uma faixa branca.
   O swatch é apenas o pequeno quadrado da cor escolhida. */
body.dark-mode .color{
  background:#202020 !important;
  border:1px solid #3E3E3E !important;
}
body.dark-mode .color input[type="color"]{
  background:transparent !important;
}

  color:#FFFFFF !important;
}
body.dark-mode .logo-preview{
  background:#202020 !important;
  color:#FFFFFF !important;
}

   sem virar manchas brancas. */

body.dark-mode .dashboard-card,
body.dark-mode .metric-card,
body.dark-mode .stat-card,
body.dark-mode .kpi-card{

body.dark-mode .stat-card *,

}

/* ===== GARANTIA DE TEXTO ===== */

body.dark-mode .sidebar,

body.dark-mode h3,
body.dark-mode h4,
body.dark-mode p,
body.dark-mode label,
body.dark-mode span,
body.dark-mode td,
body.dark-mode th{
  color:#FFFFFF !important;
}


/* =========================================================
   ARQFLOW — INTERFACE SEM QUADRADOS PREENCHIDOS
   Estruturas da ferramenta ficam transparentes,
   preservando apenas bordas e estados de destaque.
   ========================================================= */

/* Cards e contêineres estruturais: somente borda */

.color{
  background:transparent !important;
  box-shadow:none !important;
}

/* Botões secundários não devem parecer quadrados brancos */
.btn.secondary{
  background:transparent !important;
}

<script>

function uid(){
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
}
function money(v){
  return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.style.display='none',2200);
}

const DEFAULT={
  hourly:120,prolabore:0,costs:0,variableCosts:0,availableHours:160,
  productivePercent:75,tax:0,margin:20,
  services:[{
    id:uid(),name:'Projeto de Interiores',

};

function cloneData(obj){
  return JSON.parse(JSON.stringify(obj));
}
function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem('arqflow_v2'));
    if(!saved)return cloneData(DEFAULT);
    return {
      ...cloneData(DEFAULT),...saved,
      custom:{...DEFAULT.custom,...(saved.custom||{})},
      services:Array.isArray(saved.services)&&saved.services.length?saved.services:cloneData(DEFAULT.services),
      quotes:Array.isArray(saved.quotes)?saved.quotes:[],
      launches:Array.isArray(saved.launches)?saved.launches:[]
    };
  }catch(e){return cloneData(DEFAULT)}
}
let state=loadState();
function save(){localStorage.setItem('arqflow_v2',JSON.stringify(state))}

  const c=state.custom||DEFAULT.custom;
  document.documentElement.style.setProperty('--accent',c.accent);
  document.documentElement.style.setProperty('--butter',c.butter);
  document.documentElement.style.setProperty('--pink',c.pink);
  document.documentElement.style.setProperty('--bg',c.bg);
  document.documentElement.style.setProperty('--ink',c.ink || '#1D1D1F');

}

      <div class="card"><h2>Comece por aqui</h2><p class="note">Configure seu valor/hora e depois cadastre os serviços e suas etapas.</p><div class="actions"><button class="btn" onclick="go('pricing')">Configurar precificação</button></div></div>
      <div class="card"><h2>Proposta Comercial</h2><p class="note">Depois de salvar um orçamento, transforme-o em uma proposta profissional, personalize as condições e gere o PDF.</p><div class="actions"><button class="btn" onclick="go('proposal')">Abrir proposta</button></div></div>
    </div>`);
}

/* ===== PRICING ===== */
function calcHourly(form=false){
  const val=id=>form?Number(document.getElementById(id).value||0):Number(state[id]||0);
  const available=val('availableHours')||160;
  const productive=val('productivePercent')||75;
  const billable=available*productive/100;
  const base=val('prolabore')+val('costs')+val('variableCosts');
  if(!billable)return 0;
  const afterTax=(base/billable)/(1-Math.min(val('tax'),99.9)/100);
  return afterTax*(1+val('margin')/100);
}
function updatePricingPreview(){
  const el=document.getElementById('suggested');
  if(el)el.textContent=money(calcHourly(true));
}
function pricing(){
  layout('Minha Precificação','Calcule quanto vale cada hora do seu trabalho.',`
  <div class="card">
    <h2>Calculadora de valor/hora</h2>
    <p class="note">O cálculo considera remuneração, custos, horas realmente produtivas, impostos/taxas e margem.</p>
    <div class="formgrid">
      <div class="field"><label>Pró-labore / remuneração desejada (R$)</label><input id="prolabore" type="number" value="${state.prolabore||0}"></div>
      <div class="field"><label>Custos fixos mensais (R$)</label><input id="costs" type="number" value="${state.costs||0}"></div>
      <div class="field"><label>Custos variáveis mensais (R$)</label><input id="variableCosts" type="number" value="${state.variableCosts||0}"></div>
      <div class="field"><label>Horas disponíveis por mês</label><input id="availableHours" type="number" value="${state.availableHours||160}"></div>
      <div class="field">
        <label>Percentual realmente produtivo (%)</label>
        <input id="productivePercent" type="number" min="1" max="100" value="${state.productivePercent||75}">
        <div class="field-help"><b>O que significa?</b> É a parte das suas horas disponíveis que você realmente consegue dedicar a trabalhos que geram receita.</div>
        <div class="field-example"><b>Exemplo:</b> se você tem 160h disponíveis no mês, mas perde tempo com reuniões, atendimento, financeiro, marketing, mensagens e tarefas administrativas, talvez apenas 70% sejam produtivas. Nesse caso, coloque <b>70%</b> → 112h produtivas.</div>
        <div class="field-tip">💡 <b>Dica:</b> não coloque 100% se você também precisa administrar o escritório. Um percentual entre <b>60% e 80%</b> costuma ser uma referência inicial mais realista; ajuste conforme sua rotina.</div>
      </div>
      <div class="field"><label>Impostos / taxas (%)</label><input id="tax" type="number" min="0" max="99.9" step=".5" value="${state.tax||0}"></div>
      <div class="field">
        <label>Margem desejada (%)</label>
        <input id="margin" type="number" min="0" value="${state.margin||20}">
        <div class="field-help"><b>O que significa?</b> É o percentual que você acrescenta ao custo necessário para formar o seu preço final e criar uma folga para lucro, riscos, imprevistos e crescimento do escritório.</div>
        <div class="field-example"><b>Exemplo:</b> se o seu custo/hora calculado antes da margem for R$ 100 e você definir <b>20%</b> de margem, o valor/hora passa para <b>R$ 120</b>.</div>
        <div class="field-tip">💡 <b>Dica:</b> quanto maior a margem, maior será o preço final. Se você ainda não sabe o que usar, comece com <b>20%</b> e compare o resultado com os preços praticados e com o valor percebido pelo cliente.</div>
      </div>
    </div>
    <div class="section two">
      <div class="result"><small>Valor/hora recomendado</small><div class="big" id="suggested">${money(calcHourly())}</div></div>
      <div class="card"><div class="label">Como chegamos ao valor</div><p class="note">Horas produtivas = horas disponíveis × percentual produtivo. Depois somamos remuneração e custos, consideramos impostos/taxas e aplicamos a margem desejada.</p></div>
    </div>
    <div class="actions"><button class="btn" onclick="savePricing()">Salvar e usar nos orçamentos</button></div>
  </div>`);
  ['prolabore','costs','variableCosts','availableHours','productivePercent','tax','margin'].forEach(id=>document.getElementById(id).addEventListener('input',updatePricingPreview));
}
function savePricing(){
  ['prolabore','costs','variableCosts','availableHours','productivePercent','tax','margin'].forEach(id=>state[id]=Number(document.getElementById(id).value||0));
  state.productive=state.availableHours*state.productivePercent/100;
  state.hourly=calcHourly();
  save();toast('Valor/hora salvo!');
}

function stageHtml(x){return `<div class="stage-row"><input class="sn" value="${esc(x[0])}" placeholder="Nome da etapa"><input class="sh" type="number" min="0" step=".5" value="${Number(x[1]||0)}"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}

function saveService(id){

function updateQuote(){
  const s=state.services.find(x=>x.id===document.getElementById('service').value);
  const f=Number(document.getElementById('complexity').value);
  const old=[...document.querySelectorAll('.stage-check')].map(e=>e.checked);
  document.getElementById('breakdown').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><h2 style="margin:0">Etapas incluídas</h2><p class="note">Marque somente o que o cliente contratou.</p></div><button class="btn secondary" onclick="toggleStages()">Selecionar tudo</button></div>
    <div class="stage-list">${s.stages.map((x,i)=>`<label class="stage-select"><input class="stage-check" type="checkbox" ${old[i]===undefined||old[i]?'checked':''} onchange="updateQuote()"><span>${esc(x[0])}</span><small>${Number(x[1]).toFixed(1)}h base</small></label>`).join('')}</div>`;
  const selected=[...document.querySelectorAll('.stage-check')].map((e,i)=>e.checked?s.stages[i]:null).filter(Boolean);
  const hours=selected.reduce((a,x)=>a+Number(x[1]||0),0)*f;
  document.getElementById('qprice').textContent=money(hours*Number(state.hourly||0));

function toggleStages(){
  const c=[...document.querySelectorAll('.stage-check')],all=c.every(x=>x.checked);
  c.forEach(x=>x.checked=!all);updateQuote();
}
function saveQuote(){
  const s=state.services.find(x=>x.id===document.getElementById('service').value);
  const f=Number(document.getElementById('complexity').value);
  const selected=[...document.querySelectorAll('.stage-check')].map((e,i)=>e.checked?s.stages[i]:null).filter(Boolean);
  const hours=selected.reduce((a,x)=>a+Number(x[1]||0),0)*f;
  const q={
    id:uid(),date:new Date().toLocaleDateString('pt-BR'),
    client:document.getElementById('client').value.trim()||'Sem cliente',
    service:s.name,hours,price:hours*Number(state.hourly||0),status:'ENVIADO',stages:selected
  };
  state.quotes.unshift(q);save();toast('Orçamento salvo!');proposalPage(q.id);
}

/* ===== CONTROL ===== */
function normalizeQuoteStatus(status){
  return status==='NEGADO' ? 'PERDIDO' : (status||'ENVIADO');
}
function normalizeLaunchStatus(x){
  if(!x)return 'PENDENTE';
  if(x.status==='RECEBIDO' || x.status==='PAGO')return x.status;
  if(x.status==='PENDENTE' && x.dueDate){
    const today=new Date(); today.setHours(0,0,0,0);
    const due=new Date(x.dueDate+'T00:00:00');
    if(due<today)return 'VENCIDO';
  }
  return x.status||'PENDENTE';
}
function financeSummary(){
  const launches=Array.isArray(state.launches)?state.launches:[];
  const receivePending=launches.filter(x=>x.type==='RECEBER' && normalizeLaunchStatus(x)!=='RECEBIDO').reduce((a,x)=>a+Number(x.value||0),0);
  const received=launches.filter(x=>x.type==='RECEBER' && normalizeLaunchStatus(x)==='RECEBIDO').reduce((a,x)=>a+Number(x.value||0),0);
  const payPending=launches.filter(x=>x.type==='PAGAR' && normalizeLaunchStatus(x)!=='PAGO').reduce((a,x)=>a+Number(x.value||0),0);
  const paid=launches.filter(x=>x.type==='PAGAR' && normalizeLaunchStatus(x)==='PAGO').reduce((a,x)=>a+Number(x.value||0),0);
  const overdue=launches.filter(x=>normalizeLaunchStatus(x)==='VENCIDO').reduce((a,x)=>a+Number(x.value||0),0);
  return {receivePending,received,payPending,paid,balance:received-paid,overdue};
}
function control(view='orcamentos',filter='TODOS'){
  if(view==='lancamentos') return launchesPage(filter);
  const statuses=['TODOS','ENVIADO','EM NEGOCIAÇÃO','APROVADO','PERDIDO'];
  const normalizedFilter=filter==='NEGADO'?'PERDIDO':filter;
  const filtered=normalizedFilter==='TODOS'?state.quotes:state.quotes.filter(q=>normalizeQuoteStatus(q.status)===normalizedFilter);
  const counts={};
  statuses.forEach(st=>counts[st]=st==='TODOS'?state.quotes.length:state.quotes.filter(q=>normalizeQuoteStatus(q.status)===st).length);
  const tabs=statuses.map(st=>`<button class="tab ${st===normalizedFilter?'active':''}" onclick="control('orcamentos','${st}')">${st}<span class="tab-count">${counts[st]}</span></button>`).join('');
  const rows=filtered.map(q=>{
    const st=normalizeQuoteStatus(q.status);
    return `<tr><td>${esc(q.date)}</td><td><b>${esc(q.client)}</b></td><td>${esc(q.service)}</td><td>${Number(q.hours).toFixed(1)}h</td><td><b>${money(q.price)}</b></td><td><select class="status status-${st.toLowerCase().replace(/\s/g,'-')}" onchange="changeStatus('${q.id}',this.value)">${statuses.slice(1).map(x=>`<option value="${x}" ${x===st?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn secondary" style="padding:7px 9px;font-size:10px" onclick="proposalPage('${q.id}')">Proposta</button></td></tr>`;
  }).join('');
  const approvedValue=state.quotes.filter(q=>normalizeQuoteStatus(q.status)==='APROVADO').reduce((a,q)=>a+Number(q.price||0),0);
  layout('Controle & Financeiro','Acompanhe o funil comercial e transforme aprovações em lançamentos financeiros.',`
    <div class="finance-switch"><button class="active" onclick="control('orcamentos')">Orçamentos</button><button onclick="control('lancamentos')">Financeiro</button></div>
    <div class="control-summary">
      <div><span>Em negociação</span><b>${counts['EM NEGOCIAÇÃO']}</b></div>
      <div><span>Aprovados</span><b>${counts['APROVADO']}</b></div>
      <div><span>Perdidos</span><b>${counts['PERDIDO']}</b></div>
      <div><span>Valor aprovado</span><b>${money(approvedValue)}</b></div>
    </div>
    <div class="launch-toolbar"><div class="launch-filters">${tabs}</div><button class="btn" onclick="go('quote')">+ Novo orçamento</button></div>
    <div class="card"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Horas</th><th>Valor</th><th>Status</th><th>Proposta</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="launch-empty">Nenhum orçamento nesta etapa.</td></tr>'}</tbody></table></div>`);
}
function launchesPage(filter='TODOS'){
  const statuses=['TODOS','A RECEBER','RECEBIDO','VENCIDO'];
  const matches=x=>{
    const st=normalizeLaunchStatus(x);
    if(filter==='TODOS')return true;
    if(filter==='A RECEBER')return x.type==='RECEBER' && st!=='RECEBIDO';
    return st===filter;
  };
  const filtered=state.launches.filter(matches);
  const sum=financeSummary();
  const tabs=statuses.map(x=>`<button class="launch-filter ${x===filter?'active':''}" onclick="control('lancamentos','${x}')">${x}</button>`).join('');
  const rows=filtered.map(x=>{
    const status=normalizeLaunchStatus(x), type=x.type==='PAGAR'?'PAGAR':'RECEBER';
    const options=type==='RECEBER'?['PENDENTE','RECEBIDO']:['PENDENTE','PAGO'];
    return `<tr><td>${esc(x.date||'-')}</td><td><span class="launch-type ${type==='RECEBER'?'receive':'pay'}">Pagamento</span></td><td><b>${esc(x.description||'-')}</b></td><td>${esc(x.client||'-')}</td><td>${esc(x.dueDate||'-')}</td><td><b>${money(x.value)}</b></td><td><select class="launch-status status-${status.toLowerCase()}" onchange="changeLaunchStatus('${x.id}',this.value)">${options.map(st=>`<option ${st===x.status?'selected':''}>${st}</option>`).join('')}</select>${status==='VENCIDO'?'<div class="overdue-label">Vencido</div>':''}</td><td><button class="btn secondary" style="padding:6px 8px;font-size:9px" onclick="deleteLaunch('${x.id}')">Excluir</button></td></tr>`;
  }).join('');
  layout('Lançamentos','Acompanhe os pagamentos dos seus projetos, valores a receber e vencimentos.',`
    <div class="finance-switch"><button onclick="control('orcamentos')">Orçamentos</button><button class="active" onclick="control('lancamentos')">Financeiro</button></div>
    <div class="finance-note">O financeiro do ARQFLOW acompanha o que importa no dia a dia: <b>valores a receber, pagamentos e vencimentos</b>.</div>
    <div class="finance-cards">
      <div class="finance-card"><div class="finance-icon">↗</div><div class="finance-label">A receber</div><div class="finance-value">${money(sum.receivePending)}</div><div class="finance-sub">Em aberto</div></div>
      <div class="finance-card"><div class="finance-icon">✓</div><div class="finance-label">Recebido</div><div class="finance-value">${money(sum.received)}</div><div class="finance-sub">Realizado</div></div>
      
      <div class="finance-card realized"><div class="finance-icon">✓</div><div class="finance-label">Total recebido</div><div class="finance-value">${money(sum.received)}</div><div class="finance-sub">Valores já recebidos</div></div>
    </div>
    ${sum.overdue>0?`<div class="overdue-alert"><b>Atenção:</b> ${money(sum.overdue)} em lançamentos vencidos.</div>`:''}
    <div class="launch-toolbar"><div class="launch-filters">${tabs}</div><button class="btn" onclick="newLaunch()">+ Novo lançamento</button></div>
    <div class="card"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Cliente</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="launch-empty">Nenhum lançamento encontrado.</td></tr>'}</tbody></table></div>`);
}
function newLaunch(){
  layout('Novo lançamento','Registre uma entrada ou saída financeira do escritório.',`
    <div class="card"><div class="launch-modal-grid">
      <div class="field"><label>Tipo</label><select id="lType"><option value="RECEBER">Pagamento do cliente</option></select></div>
      <div class="field"><label>Valor (R$)</label><input id="lValue" type="number" min="0" step=".01" placeholder="0,00"></div>
      <div class="field"><label>Descrição</label><input id="lDesc" placeholder="Ex.: Parcela do projeto"></div>
      <div class="field"><label>Cliente</label><input id="lClient" placeholder="Nome"></div>
      <div class="field"><label>Data</label><input id="lDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Vencimento</label><input id="lDue" type="date"></div>
      <div class="field" style="grid-column:1/-1"><label>Observações</label><textarea id="lNotes" rows="4" placeholder="Informações adicionais"></textarea></div>
    </div><div class="actions"><button class="btn secondary" onclick="control('lancamentos')">Cancelar</button><button class="btn" onclick="saveLaunch()">Salvar lançamento</button></div></div>`);
}
function saveLaunch(){
  const value=Number(document.getElementById('lValue').value||0), desc=document.getElementById('lDesc').value.trim();
  if(value<=0){toast('Informe um valor maior que zero.');return}
  if(!desc){toast('Informe uma descrição.');return}
  const type=document.getElementById('lType').value;
  state.launches.unshift({id:uid(),type,value,description:desc,client:document.getElementById('lClient').value.trim(),date:document.getElementById('lDate').value,dueDate:document.getElementById('lDue').value,notes:document.getElementById('lNotes').value.trim(),status:'PENDENTE'});
  save();toast('Lançamento salvo!');control('lancamentos');
}
function changeLaunchStatus(id,status){
  const x=state.launches.find(x=>x.id===id);
  if(x){x.status=status;save();toast(status==='RECEBIDO'||status==='PAGO'?'Pagamento registrado!':'Lançamento atualizado!');launchesPage()}
}
function deleteLaunch(id){
  if(!confirm('Excluir este lançamento?'))return;
  state.launches=state.launches.filter(x=>x.id!==id);save();toast('Lançamento excluído.');launchesPage();
}
function ensureReceivable(q){
  if(!Array.isArray(state.launches))state.launches=[];
  if(state.launches.some(x=>x.quoteId===q.id && x.type==='RECEBER'))return;
  const due=new Date(); due.setDate(due.getDate()+30);
  state.launches.unshift({id:uid(),type:'RECEBER',value:Number(q.price||0),description:`Projeto — ${q.service}`,client:q.client||'',date:new Date().toISOString().slice(0,10),dueDate:due.toISOString().slice(0,10),notes:'Lançamento criado automaticamente quando o orçamento foi aprovado.',status:'PENDENTE',quoteId:q.id});
}
function changeStatus(id,status){
  const q=state.quotes.find(x=>x.id===id);
  if(q){
    q.status=status;
    if(status==='APROVADO')ensureReceivable(q);
    save();
    toast(status==='APROVADO'?'Orçamento aprovado e lançamento criado!':'Status atualizado!');
    control('orcamentos',status);
  }
}

/* ===== CUSTOM ===== */

function previewCustomColorInputs(){
  const ids=['cAccent','cButter','cPink','cBg','cInk'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el && !el.dataset.bound){
      el.dataset.bound='1';
      el.addEventListener('input',()=>{
        const map={cAccent:'--accent',cButter:'--butter',cPink:'--pink-soft',cBg:'--bg',cInk:'--ink'};
        document.documentElement.style.setProperty(map[id],el.value);
      });
    }
  });
}

function custom(){
  const c=state.custom||DEFAULT.custom;
  const logo = c.logo || '';
  layout('Personalização','Adapte a aparência do ARQFLOW e defina a identidade que aparecerá nas suas propostas.',`
  <div class="section two">
    <div class="card">
      <h2>Identidade visual</h2>
      <div class="custom-grid">
        <div class="field"><label>Fonte</label>
          <select id="cFont">${['Montserrat','Inter','Poppins','Lato','Playfair Display'].map(x=>`<option ${c.font===x?'selected':''}>${x}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Dourado dos botões</label><div class="color"><input id="cAccent" type="color" value="${c.accent||'#C5A880'}"></div></div>
        <div class="field"><label>Dourado dos títulos</label><div class="color"><input id="cButter" type="color" value="${c.butter||'#C5A880'}"></div></div>
        <div class="field"><label>Fundo de seleção</label><div class="color"><input id="cPink" type="color" value="${c.pink||'#F1ECE5'}"></div></div>
        <div class="field"><label>Fundo principal</label><div class="color"><input id="cBg" type="color" value="${c.bg||'#FBFBFD'}"></div></div>
      </div>
      <div class="actions">
        <button class="btn secondary" onclick="resetCustom()">Restaurar padrão</button>
        <button class="btn" onclick="saveCustom()">Salvar personalização</button>
      </div>
    </div>

    <div class="card">
      <h2>Logo do escritório</h2>
      <p class="note">Envie seu logo em <strong>PNG</strong>. Ele ficará salvo neste navegador e será colocado automaticamente no topo da Proposta Comercial e no PDF/arquivo impresso.</p>
      <div class="logo-upload">
        <div id="logoPreview" class="logo-preview ${logo?'':'empty'}">
          ${logo?`<img src="${logo}" alt="Logo do escritório">`:'Nenhum logo selecionado'}
        </div>
        <div>
          <div class="logo-actions">
            <label class="btn" style="cursor:pointer">
              Escolher PNG
              <input id="logoFile" type="file" accept="image/png,.png" hidden>
            </label>
            <button class="btn secondary" onclick="removeLogo()">Remover logo</button>
          </div>
          <div class="note" style="margin-top:8px">Recomendado: PNG com fundo transparente.</div>
        </div>
      </div>
    </div>
  </div>`);

  const file=document.getElementById('logoFile');
  if(file){
    file.addEventListener('change', async function(){
      const f=this.files && this.files[0];
      if(!f) return;
      if(f.type!=='image/png' && !/\.png$/i.test(f.name)){
        toast('Selecione um arquivo PNG.');
        this.value='';
        return;
      }
      if(f.size>3*1024*1024){
        toast('O PNG deve ter no máximo 3 MB.');
        this.value='';
        return;
      }
      const reader=new FileReader();
      reader.onload=function(){
        state.custom.logo=reader.result;
        save();
        toast('Logo salvo!');
        custom();
      };
      reader.readAsDataURL(f);
    });
  }
}
  previewCustomColorInputs();
function saveCustom(){
  state.custom={
    ...state.custom,
    font:cFont.value,
    accent:cAccent.value,
    butter:cButter.value,
    pink:cPink.value,
    bg:cBg.value,
    ink:(document.getElementById('cInk')?.value || '#1D1D1F')
  };
  save();applyTheme();toast('Personalização salva!');custom();
}
function resetCustom(){
  state.custom=cloneData(DEFAULT.custom);
  save();
  applyTheme();
  toast('Padrão restaurado!');
  custom();
}



/* Boot */
applyTheme();
installNavIcons();
go('dashboard');
</script>

<style>

.arq-kpi.accent{background:var(--accent);border-color:transparent}.arq-kpi.alert{background:#fff7f0}
.arq-grid-2{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.arq-card{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}

.arq-pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:15px}.arq-stage{padding:11px 8px;border:1px solid var(--line);border-radius:10px;text-align:center}.arq-stage b{display:block;font-size:17px}.arq-stage span{display:block;font-size:9px;color:var(--muted);margin-top:4px}
.arq-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.arq-quick button{text-align:left;min-height:72px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font:inherit}.arq-quick button:hover{border-color:#c7b79f}.arq-quick strong{display:block;font-size:12px}.arq-quick span{font-size:10px;color:var(--muted)}
.arq-price-box{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.arq-price{border:1px solid var(--line);border-radius:12px;padding:14px}.arq-price.featured{background:var(--accent);border-color:transparent}.arq-price small{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.arq-price b{display:block;font-size:21px;margin-top:7px}.arq-price span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.arq-tip{padding:12px 14px;border-left:3px solid #C5A880;background:#faf8f3;font-size:11px;margin-top:13px}.arq-section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.arq-section-title h2{margin:0}.arq-empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

</style>
<script>
/* ===== CAMADA DE PRODUTO — preserva o motor original e adiciona valor ===== */
function arqFinance(){
  const launches=Array.isArray(state.launches)?state.launches:[];
  const received=launches.filter(x=>x.type==='RECEBER'&&normalizeLaunchStatus(x)==='RECEBIDO').reduce((a,x)=>a+Number(x.value||0),0);
  const pending=launches.filter(x=>x.type==='RECEBER'&&normalizeLaunchStatus(x)!=='RECEBIDO').reduce((a,x)=>a+Number(x.value||0),0);
  const overdue=launches.filter(x=>x.type==='RECEBER'&&normalizeLaunchStatus(x)==='VENCIDO').reduce((a,x)=>a+Number(x.value||0),0);
  return {received,pending,overdue};
}
function arqStatusCount(st){return state.quotes.filter(q=>normalizeQuoteStatus(q.status)===st).length}
function dashboard(){
  const fin=arqFinance();
  const total=state.quotes.reduce((a,q)=>a+Number(q.price||0),0);
  const hours=state.quotes.reduce((a,q)=>a+Number(q.hours||0),0);
  const approved=state.quotes.filter(q=>normalizeQuoteStatus(q.status)==='APROVADO').reduce((a,q)=>a+Number(q.price||0),0);
  const negotiation=state.quotes.filter(q=>normalizeQuoteStatus(q.status)==='EM NEGOCIAÇÃO').reduce((a,q)=>a+Number(q.price||0),0);
  const recent=state.quotes.slice(0,5).map(q=>`<tr><td>${esc(q.date||'-')}</td><td><b>${esc(q.client)}</b></td><td>${esc(q.service)}</td><td><b>${money(q.price)}</b></td><td><span class="status">${esc(normalizeQuoteStatus(q.status))}</span></td><td><button class="btn secondary" style="padding:6px 9px;font-size:9px" onclick="proposalPage('${q.id}')">Proposta</button></td></tr>`).join('');
  layout('Dashboard','Seu escritório, seus números e seus projetos em uma única visão.',`
    <div class="arq-hero"><div class="arq-hero-copy"><div class="arq-eyebrow">ARQFLOW · Gestão profissional</div><h1>Tenha clareza sobre o que cobrar, vender e receber.</h1><p>Precifique com estratégia, acompanhe seu funil e transforme seus orçamentos em propostas profissionais.</p></div><div class="arq-actions"><button class="btn" onclick="go('quote')">+ Novo orçamento</button></div></div>
    <div class="arq-kpis">
      <div class="arq-kpi accent"><span class="k-label">Valor/hora recomendado</span><span class="k-value">${money(state.hourly||0)}</span><span class="k-foot">Base da sua precificação</span></div>
      <div class="arq-kpi"><span class="k-label">Em negociação</span><span class="k-value">${money(negotiation)}</span><span class="k-foot">${arqStatusCount('EM NEGOCIAÇÃO')} orçamento(s)</span></div>
      <div class="arq-kpi"><span class="k-label">A receber</span><span class="k-value">${money(fin.pending)}</span><span class="k-foot">Valores em aberto</span></div>
      <div class="arq-kpi ${fin.overdue?'alert':''}"><span class="k-label">Recebido</span><span class="k-value">${money(fin.received)}</span><span class="k-foot">${fin.overdue?money(fin.overdue)+' vencido(s)':'Tudo em dia'}</span></div>
    </div>
    <div class="arq-grid-2">
      <div class="arq-card"><div class="arq-section-title"><div><h2>Seu funil comercial</h2><p class="note">Veja onde estão seus projetos e oportunidades.</p></div><button class="btn secondary" onclick="go('control')">Abrir controle</button></div>
        <div class="arq-pipeline">
          <div class="arq-stage"><b>${state.quotes.length}</b><span>Orçamentos</span></div><div class="arq-stage"><b>${arqStatusCount('ENVIADO')}</b><span>Enviados</span></div><div class="arq-stage"><b>${arqStatusCount('EM NEGOCIAÇÃO')}</b><span>Negociação</span></div><div class="arq-stage"><b>${arqStatusCount('APROVADO')}</b><span>Aprovados</span></div><div class="arq-stage"><b>${arqStatusCount('PERDIDO')}</b><span>Perdidos</span></div>
        </div>
        <div class="arq-tip"><b>Oportunidade:</b> ${money(approved)} já está aprovado. Use a área de Proposta Comercial para formalizar o próximo passo.</div>
      </div>
      <div class="arq-card"><h2>Acesso rápido</h2><p class="note">As tarefas que você mais usa, em um clique.</p><div class="arq-quick"><button onclick="go('pricing')"><strong>Precificar</strong><span>Defina seu valor/hora</span></button><button onclick="go('services')"><strong>Serviços</strong><span>Organize suas etapas</span></button><button onclick="go('quote')"><strong>Orçamento</strong><span>Calcule um novo projeto</span></button><button onclick="go('control')"><strong>Pagamentos</strong><span>Veja o que falta receber</span></button></div></div>
    </div>
    <div class="arq-card" style="margin-top:14px"><div class="arq-section-title"><div><h2>Orçamentos recentes</h2><p class="note">Acompanhe rapidamente os últimos projetos cadastrados.</p></div><button class="btn secondary" onclick="control('orcamentos')">Ver todos</button></div><div class="card" style="padding:0;border:0"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${recent||'<tr><td colspan="6"><div class="arq-empty">Seu primeiro orçamento começa aqui.</div></td></tr>'}</tbody></table></div></div>`);
}

function pricing(){
  layout('Minha Precificação','Defina um valor/hora que proteja seus custos e sustente o crescimento do escritório.',`
  <div class="card"><h2>Calculadora de valor/hora</h2><p class="note">O ARQFLOW transforma seus custos, capacidade produtiva, impostos e margem em uma referência objetiva para cobrar melhor.</p>
    <div class="formgrid"><div class="field"><label>Pró-labore / remuneração desejada (R$)</label><input id="prolabore" type="number" value="${state.prolabore||0}"></div><div class="field"><label>Custos fixos mensais (R$)</label><input id="costs" type="number" value="${state.costs||0}"></div><div class="field"><label>Custos variáveis mensais (R$)</label><input id="variableCosts" type="number" value="${state.variableCosts||0}"></div><div class="field"><label>Horas disponíveis por mês</label><input id="availableHours" type="number" value="${state.availableHours||160}"></div><div class="field"><label>Percentual realmente produtivo (%)</label><input id="productivePercent" type="number" min="1" max="100" value="${state.productivePercent||75}"><div class="field-help"><b>Considere o tempo que realmente gera receita.</b> Reuniões, atendimento, financeiro, marketing e administração reduzem as horas produtivas.</div></div><div class="field"><label>Impostos / taxas (%)</label><input id="tax" type="number" min="0" max="99.9" step=".5" value="${state.tax||0}"></div><div class="field"><label>Margem desejada (%)</label><input id="margin" type="number" min="0" value="${state.margin||20}"><div class="field-help">Percentual adicional para lucro, riscos, imprevistos e crescimento.</div></div></div>
    <div class="result"><small>Valor/hora recomendado</small><div class="big" id="suggested">${money(calcHourly())}</div><p class="note">Use este valor como base para todos os seus orçamentos.</p></div>
    <div class="arq-tip"><b>Referência:</b> este valor/hora é calculado a partir dos seus custos, horas produtivas, impostos e margem desejada. Use-o como base para calcular o valor dos seus projetos conforme as horas trabalhadas.</div>
    <div class="actions"><button class="btn" onclick="savePricing()">Salvar e usar nos orçamentos</button></div>
  </div>`);
  const ids=['prolabore','costs','variableCosts','availableHours','productivePercent','tax','margin'];
  ids.forEach(id=>document.getElementById(id).addEventListener('input',updatePricingPreview));
}

function quote(){
  if(!state.services.length){layout('Novo Orçamento','Cadastre um serviço antes de criar um orçamento.',`<div class="card empty"><button class="btn" onclick="go('services')">Cadastrar serviço</button></div>`);return;}
  const opts=state.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  layout('Novo Orçamento','Calcule o projeto e tenha três referências de preço antes de apresentar o investimento.',`<div class="two"><div class="card"><div class="formgrid"><div class="field"><label>Cliente / projeto</label><input id="client" placeholder="Ex.: Taiana e Alex"></div><div class="field"><label>Serviço</label><select id="service">${opts}</select></div><div class="field"><label>Complexidade</label><select id="complexity"><option value=".85">Baixa — 85%</option><option value="1" selected>Média — 100%</option><option value="1.25">Alta — 125%</option><option value="1.5">Muito alta — 150%</option></select></div><div class="field"><label>Valor/hora calculado</label><input id="qhour" value="${Number(state.hourly||0).toFixed(2)}" readonly></div></div><div id="breakdown" class="section"></div></div><div class="result"><small>Investimento recomendado</small><div class="big" id="qprice">R$ 0,00</div><p id="qhours" class="note">0h estimadas</p><div class="arq-price-box"><div class="arq-price"><small>Mínimo</small><b id="qmin">R$ 0,00</b></div><div class="arq-price featured"><small>Recomendado</small><b id="qrec">R$ 0,00</b></div><div class="arq-price"><small>Premium</small><b id="qprem">R$ 0,00</b></div></div><div class="arq-tip">💡 <b>Use o recomendado como ponto de partida.</b> O premium pode ser usado quando o escopo, prazo ou nível de exigência justificar maior valor.</div><div class="actions"><button class="btn" onclick="saveQuote()">Salvar orçamento</button></div></div></div>`);
  document.getElementById('service').addEventListener('change',updateQuote);document.getElementById('complexity').addEventListener('change',updateQuote);updateQuote();
}
const _updateQuoteOriginal=updateQuote;
updateQuote=function(){
  _updateQuoteOriginal();
  const p=Number(document.getElementById('qprice')?.textContent.replace(/[^0-9,-]/g,'').replace(/\./g,'').replace(',','.')||0);
  if(document.getElementById('qmin'))document.getElementById('qmin').textContent=money(p*.90);
  if(document.getElementById('qrec'))document.getElementById('qrec').textContent=money(p);
  if(document.getElementById('qprem'))document.getElementById('qprem').textContent=money(p*1.10);
};

/* Reaponta o roteador para as versões aprimoradas. */
if(typeof pages==='object'){pages.dashboard=dashboard;pages.pricing=pricing;pages.quote=quote;}
